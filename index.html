<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fafc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="赛车打卡"><title>🏎️ 赛车成长大冒险</title><style>body{margin:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#172033}main{max-width:650px;margin:auto;padding:18px 16px 65px}.hero{background:linear-gradient(120deg,#dbeafe,#f5e8ff);border-radius:22px;padding:20px}.hero h1{font-size:25px;margin:5px 0}.sub{color:#526078;font-size:14px}.road{height:14px;background:#fff;border-radius:20px;overflow:hidden;margin:15px 0}.road>div{background:#f59e0b;height:100%;width:0;transition:width .3s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:white;border:1px solid #e1e7f0;border-radius:17px;padding:16px;margin:13px 0}button{font:inherit;cursor:pointer;min-height:48px;border:1px solid #cbd5e1;border-radius:13px;background:white;color:#172033;padding:10px 14px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2563eb}button.task{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;margin:9px 0;gap:10px}button.done{background:#dcfce7;border-color:#4ade80}button.bonus{border-style:dashed;border-color:#eab308}.small{font-size:13px;color:#64748b}h2{font-size:19px;margin:20px 0 10px}input,select{font:inherit;font-size:16px;padding:9px;border:1px solid #cbd5e1;border-radius:9px;max-width:100%;box-sizing:border-box}.pill{background:#fef3c7;border-radius:20px;padding:7px 10px;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px}.reward{border-top:1px solid #eee;padding:12px 0}.status{color:#166534;font-weight:700}.muted{color:#64748b}.foot{font-size:12px;color:#64748b;line-height:1.6}.hidden{display:none}#toast{min-height:22px;color:#166534;font-weight:bold}label{display:block;margin:8px 0}.tag{font-size:12px;background:#e0e7ff;border-radius:9px;padding:3px 6px} @media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><div class="hero"><div class="row"><div><div class="sub">🏁 小小赛车手</div><h1>赛车成长大冒险</h1></div><div style="font-size:52px">🏎️</div></div><div class="row"><span id="stars">⭐ 0 星</span><span id="count">0/0 关</span></div><div class="road"><div id="bar"></div></div><div id="message" class="sub">完成任务，赛车向前冲！</div></div><div class="card"><div class="row"><label for="day">📅 打卡日期</label><input id="day" type="date"></div><div id="weekMode" class="hidden"><p><strong>周末任务安排</strong></p><div class="actions"><button id="outdoor" type="button">🌳 大户外日</button><button id="study" type="button">✏️ 作业＋柔术日</button></div><p class="small">两天可自由调换。周末作业、柔术、大户外每周各计一次。</p></div></div><h2>🎯 今日必做</h2><div id="tasks"></div><h2>🌟 每日额外挑战</h2><div id="bonus"></div><div id="toast" role="status" aria-live="polite"></div><div class="card"><h2 style="margin-top:0">🎁 礼物兑换站</h2><div class="small" id="wallet"></div><div id="shop"></div><details><summary>⚙️ 家长设置：修改礼物</summary><div id="settings"></div></details></div><div class="card"><h2 style="margin-top:0">📅 最近7天</h2><div id="history"></div></div><div class="card"><h2 style="margin-top:0">🛡️ 数据备份</h2><div class="actions"><button id="export" type="button">导出备份</button><label style="margin:0"><span class="small">导入备份：</span><input id="import" type="file" accept="application/json,.json" style="width:190px"></label></div><p class="foot">记录保存在当前设备的浏览器中。请定期导出备份；清除网站数据、更换设备或使用无痕模式可能导致记录丢失。</p></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),KEY='racer-quest-v2';let state={checks:{},modes:{},purchases:[],rewards:[{name:'赛车贴纸',cost:40},{name:'小汽车模型',cost:150},{name:'自选小礼物',cost:250}]};try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')state={...state,...s}}catch(e){}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('toast').textContent='无法保存数据，请检查浏览器存储设置'}};const today=new Date();const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('day').value=iso(today);const date=()=>new Date($('day').value+'T12:00:00');const day=()=>$('day').value;const dow=()=>date().getDay();const weekStart=()=>{let d=date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};const task=(id,name,pts,bonus=false)=>({id,name,pts,bonus});function tasksFor(){let w=dow(),t=[task('words','🔤 拓词2个（8–10分钟）',5)];if(w>=1&&w<=5)t.unshift(task('homework','✏️ 完成当天学校作业',10));if(w===1)t.push(task('fitness','🏃 体能课60分钟',10));if(w===2||w===4)t.push(task('english','🇬🇧 19:30 英语外教25分钟',5));if(w===3)t.push(task('swimoptional','🏊 游泳90分钟（可选）',10,true));if(w===5){t.push(task('swim','🏊 游泳90分钟',10));t.push(task('chess','♟️ 国际象棋',5))}if(w===0||w===6){let m=state.modes[day()]||'study';if(m==='outdoor')t.push(task('weekly-outdoor-'+weekStart(),'🌳 本周大户外',15));else {t.push(task('weekly-homework-'+weekStart(),'✏️ 完成本周剩余作业',10));t.push(task('weekly-jujitsu-'+weekStart(),'🥋 本周柔术课',10))}}t.push(task('raz','📖 RAZ阅读1篇（Bonus）',8,true));return t}const checked=id=>!!state.checks[id];const checkKey=id=>id.startsWith('weekly-')?id:day()+'|'+id;function toggle(id){let k=checkKey(id);state.checks[k]=!state.checks[k];save();render();$('toast').textContent=state.checks[k]?'🎉 完成啦！赛车又前进了！':'已取消本次打卡'}function checkedId(id){return checked(checkKey(id))}function allPoints(){let total=0;Object.entries(state.checks).forEach(([key,v])=>{if(!v)return;let id=key.includes('|')?key.split('|').slice(1).join('|'):key;if(id==='raz')total+=8;else if(id==='words'||id==='english'||id==='chess')total+=5;else if(id==='weekly-outdoor-'+key.slice(15))total+=15;else if(id.startsWith('weekly-outdoor-'))total+=15;else if(id.startsWith('weekly-')||['homework','fitness','swim','swimoptional'].includes(id))total+=10});return total}function balance(){return allPoints()-state.purchases.reduce((s,p)=>s+p.cost,0)}function renderTasks(){let ts=tasksFor(),main=ts.filter(x=>!x.bonus),extra=ts.filter(x=>x.bonus);for(const [el,arr] of [[$('tasks'),main],[$('bonus'),extra]]){el.replaceChildren();arr.forEach(t=>{let b=document.createElement('button');b.type='button';b.className='task'+(checkedId(t.id)?' done':'')+(t.bonus?' bonus':'');let a=document.createElement('span');a.textContent=t.name;let c=document.createElement('strong');c.textContent=checkedId(t.id)?'✅ 已完成':'⭐ +'+t.pts;b.append(a,c);b.addEventListener('click',()=>toggle(t.id));el.append(b)})}let n=main.filter(x=>checkedId(x.id)).length;$('count').textContent=n+'/'+main.length+' 关';$('bar').style.width=(main.length?n/main.length*100:0)+'%';$('message').textContent=n===main.length?'🏆 今日通关！真棒！':'完成一项任务，赛车就向终点前进！';$('stars').textContent='⭐ '+allPoints()+' 星';$('wallet').textContent='可用星星：'+balance()+' ⭐';$('weekMode').classList.toggle('hidden',dow()!==0&&dow()!==6);let m=state.modes[day()]||'study';$('outdoor').style.background=m==='outdoor'?'#dcfce7':'';$('study').style.background=m==='study'?'#dcfce7':''}function renderShop(){let box=$('shop');box.replaceChildren();state.rewards.forEach((r,i)=>{let div=document.createElement('div');div.className='reward row';let span=document.createElement('span');span.textContent=r.name+' · ⭐'+r.cost;let b=document.createElement('button');b.type='button';b.textContent='兑换';b.disabled=balance()<r.cost;b.addEventListener('click',()=>{if(balance()<r.cost)return;if(confirm('确定兑换「'+r.name+'」吗？')){state.purchases.push({name:r.name,cost:r.cost,date:day()});save();render();$('toast').textContent='🎁 已兑换！请家长兑现礼物'}});div.append(span,b);box.append(div)})}function renderSettings(){let el=$('settings');el.replaceChildren();state.rewards.forEach((r,i)=>{let div=document.createElement('div');div.className='row';let name=document.createElement('input');name.value=r.name;name.setAttribute('aria-label','礼物名称');name.style.width='55%';let cost=document.createElement('input');cost.type='number';cost.min='1';cost.max='10000';cost.value=r.cost;cost.style.width='35%';cost.setAttribute('aria-label','兑换星星');for(const input of [name,cost])input.addEventListener('change',()=>{let n=name.value.trim().slice(0,40),c=Number(cost.value);if(!n||!Number.isInteger(c)||c<1||c>10000){$('toast').textContent='请填写礼物名称及1–10000之间的星星';return}state.rewards[i]={name:n,cost:c};save();render()});div.append(name,cost);el.append(div)})}function renderHistory(){let el=$('history');el.replaceChildren();for(let i=0;i<7;i++){let d=date();d.setDate(d.getDate()-i);let k=iso(d);let count=Object.entries(state.checks).filter(([id,v])=>v&&id.startsWith(k+'|')).length;let row=document.createElement('div');row.className='row reward';let a=document.createElement('span');a.textContent=k;let b=document.createElement('span');b.textContent=count+' 项日常打卡';row.append(a,b);el.append(row)}}function render(){renderTasks();renderShop();renderSettings();renderHistory()}$('day').addEventListener('change',()=>{if(!$('day').value)$('day').value=iso(today);render()});for(const [id,mode] of [['outdoor','outdoor'],['study','study']])$(id).addEventListener('click',()=>{state.modes[day()]=mode;save();render()});$('export').addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='赛车打卡备份-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('import').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('文件太大');let x=JSON.parse(await f.text());if(!x||typeof x.checks!=='object'||!Array.isArray(x.purchases)||!Array.isArray(x.rewards))throw Error('格式不正确');if(!confirm('导入将覆盖本机现有打卡记录，确定继续？'))return;state={checks:x.checks,modes:x.modes||{},purchases:x.purchases,rewards:x.rewards};save();render();$('toast').textContent='备份导入成功'}catch(err){$('toast').textContent='导入失败：'+err.message}finally{e.target.value=''}});render()})();</script></body></html>
